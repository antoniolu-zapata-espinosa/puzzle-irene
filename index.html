<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f2ff;--card:#fff;--ink:#1d2a4d;--accent:#ff5c8a;--line:rgba(29,42,77,.22);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a33;--card:#1c2a52;--ink:#eaf1ff;--accent:#ff7aa2;--line:rgba(234,241,255,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a33;--card:#1c2a52;--ink:#eaf1ff;--accent:#ff7aa2;--line:rgba(234,241,255,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
@supports (height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--ink);font:700 16px/1.3 Nunito,ui-rounded,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#app{display:grid;grid-template-columns:minmax(230px,330px) 1fr;gap:14px;padding:12px;height:100%}
#side{display:flex;flex-direction:column;gap:10px;min-height:0}
#top{display:flex;gap:10px;align-items:flex-start}
#prev{width:120px;aspect-ratio:6/5;object-fit:cover;border-radius:10px;border:3px solid var(--card);flex:none}
#ctl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
#ctl .row{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:7px 12px;background:var(--accent);color:#1d0a14;cursor:pointer}
button.alt{background:var(--card);color:var(--ink)}
button:focus-visible,.th:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#gal{display:flex;gap:6px;overflow-x:auto;padding:4px 4px 6px 0}
.th{position:relative;flex:none;width:52px;height:44px;border-radius:8px;border:3px solid transparent;background-size:cover;background-position:center;cursor:pointer}
.th.on{border-color:var(--accent)}
.th b{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;line-height:20px;text-align:center}
#tray{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;padding:8px;background:var(--card);border-radius:14px}
#main{display:flex;align-items:center;justify-content:center;min-width:0}
#board{position:relative;aspect-ratio:6/5;width:min(100%,calc((100vh - 40px)*1.2));width:min(100%,calc((100dvh - 40px)*1.2));border-radius:12px;overflow:hidden;background:linear-gradient(to right,var(--line) 1px,transparent 1px) 0 0/16.6667% 100%,linear-gradient(to bottom,var(--line) 1px,transparent 1px) 0 0/100% 20%,var(--card);outline:3px solid var(--ink)}
#ghost{position:absolute;inset:0;background-image:var(--img);background-size:100% 100%;opacity:0;pointer-events:none;transition:opacity .2s}
#board.help #ghost{opacity:.22}
.piece{flex:none;width:var(--ts,40px);height:var(--ts,40px);background-image:var(--img);background-size:600% 500%;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.4);touch-action:none;cursor:grab}
.piece.drag{position:fixed;z-index:50;width:var(--cw);height:var(--cw);box-shadow:0 10px 22px rgba(0,0,0,.45);cursor:grabbing}
.piece.placed{position:absolute;width:calc(100%/6);height:20%;border-radius:0;box-shadow:none;pointer-events:none;z-index:1;animation:pop .25s}
.piece.bad{animation:shake .3s}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,15,40,.6);z-index:100;padding:20px}
#win.on{display:flex}
#win .box{background:var(--card);border-radius:20px;padding:26px;text-align:center;max-width:340px}
#win h2{margin:0 0 6px;font-size:28px}
#win .row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
@media (max-width:760px),(max-aspect-ratio:1/1){
 #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:10px}
 #main{order:-1}
 #board{width:min(100%,calc((100vh - 250px)*1.2));width:min(100%,calc((100dvh - 250px)*1.2))}
}
@media (prefers-reduced-motion:reduce){.piece.placed,.piece.bad{animation:none}}
</style>
</head>
<body>
<div id="app">
 <div id="side">
  <div id="top">
   <img id="prev" alt="Imagen completa">
   <div id="ctl">
    <div class="row">
     <button id="add">＋ Fotos</button>
     <button id="help" class="alt">Ayuda</button>
     <button id="again" class="alt">Mezclar</button>
    </div>
    <div id="gal" role="list"></div>
   </div>
  </div>
  <div id="tray"></div>
 </div>
 <div id="main"><div id="board"><div id="ghost"></div></div></div>
</div>
<div id="win"><div class="box"><h2>¡Lo has conseguido! 🎉</h2><div>Puzzle completado</div><div class="row"><button id="next">Siguiente imagen</button><button id="rep" class="alt">Repetir</button></div></div></div>
<input id="file" type="file" accept="image/*" multiple hidden>

const dbp=new Promise(res=>{try{const q=indexedDB.open('puzzle-hija',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}});
async function save(){const d=await dbp;if(!d)return;try{d.transaction('k','readwrite').objectStore('k').put(user,'imgs')}catch(e){}}
async function load(){const d=await dbp;if(!d)return[];return new Promise(res=>{try{const q=d.transaction('k').objectStore('k').get('imgs');q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}

function fit(file){return new Promise((res,rej)=>{
 const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const c=document.createElement('canvas');c.width=1200;c.height=1000;const g=c.getContext('2d');
  const k=Math.max(1200/im.width,1000/im.height),w=im.width*k,h=im.height*k;
  g.drawImage(im,(1200-w)/2,(1000-h)/2,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85))};
 im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}

function refresh(){all=builtin.concat(user.map(src=>({src,user:1})))}
function gallery(){
 const gal=$('gal');gal.innerHTML='';
 all.forEach((im,k)=>{
  const b=document.createElement('div');b.className='th'+(k===cur?' on':'');b.tabIndex=0;b.setAttribute('role','listitem');
  b.style.backgroundImage='url('+im.src+')';
  b.onclick=()=>{cur=k;build()};
  b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cur=k;build()}};
  if(im.user){const x=document.createElement('b');x.textContent='×';x.title='Quitar imagen';
   x.onclick=e=>{e.stopPropagation();user.splice(k-builtin.length,1);save();refresh();cur=Math.min(cur,all.length-1);build()};b.append(x)}
  gal.append(b)});
}
function sizeCells(){app.style.setProperty('--cw',(board.clientWidth/C)+'px')}
function build(){
 refresh();if(cur>=all.length)cur=0;
 board.querySelectorAll('.piece').forEach(p=>p.remove());tray.innerHTML='';placed=0;$('win').classList.remove('on');
 app.style.setProperty('--img','url('+all[cur].src+')');
 $('prev').src=all[cur].src;sizeCells();gallery();
 const order=[...Array(N).keys()];
 for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
 order.forEach(i=>{
  const p=document.createElement('div');p.className='piece';p.dataset.i=i;
  p.style.backgroundPosition=((i%C)*100/(C-1))+'% '+(Math.floor(i/C)*100/(R-1))+'%';
  p.onpointerdown=down;tray.append(p)});
 fitTray();
}
function fitTray(){
 const cw=board.clientWidth/C,g=6,w=tray.clientWidth-16,h=tray.clientHeight-16,n=tray.children.length;
 let s=Math.floor(cw);
 for(;s>28;s--){if(Math.floor((w+g)/(s+g))*Math.floor((h+g)/(s+g))>=n)break}
 app.style.setProperty('--ts',s+'px');
}
function down(e){
 e.preventDefault();const p=e.currentTarget,cw=board.clientWidth/C;
 p.setPointerCapture(e.pointerId);p.classList.add('drag');D={p,cw};
 p.onpointermove=move;p.onpointerup=p.onpointercancel=up;move(e);
}
function move(e){if(!D)return;D.p.style.left=(e.clientX-D.cw/2)+'px';D.p.style.top=(e.clientY-D.cw/2)+'px'}
function up(e){
 if(!D)return;const {p,cw}=D;D=null;
 p.onpointermove=p.onpointerup=p.onpointercancel=null;
 p.classList.remove('drag');p.style.left=p.style.top='';
 const i=+p.dataset.i,r=board.getBoundingClientRect(),col=i%C,row=Math.floor(i/C);
 const tx=r.left+(col+.5)*cw,ty=r.top+(row+.5)*cw;
 if(Math.hypot(e.clientX-tx,e.clientY-ty)<cw*.65){
  p.classList.add('placed');p.style.left=(col*100/C)+'%';p.style.top=(row*100/R)+'%';board.append(p);fitTray();
  if(++placed===N)setTimeout(()=>$('win').classList.add('on'),450);
 }else if(e.type==='pointerup'){
  p.classList.add('bad');setTimeout(()=>p.classList.remove('bad'),320);
 }
}

$('add').onclick=()=>$('file').click();
$('file').onchange=async e=>{
 for(const f of e.target.files){try{user.push(await fit(f))}catch(x){}}
 e.target.value='';await save();refresh();cur=all.length-1;build();
};
$('help').onclick=()=>board.classList.toggle('help');
$('again').onclick=build;$('rep').onclick=build;
$('next').onclick=()=>{cur=(cur+1)%all.length;build()};
addEventListener('resize',()=>{sizeCells();fitTray()});
addEventListener('load',fitTray);
build();
load().then(u=>{if(u&&u.length){user=u;refresh();gallery()}});
</script>
</body>
</html>
